<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Timer</title></head><body style="background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:30px"><h1>Timer Test</h1><div id="t" style="font-size:60px;color:#fbbf24">15</div><button onclick="testSound()" style="padding:15px 30px;font-size:18px;border-radius:10px;border:0;background:#fbbf24;font-weight:700">Click to Test Sound</button><script>let c=15;let aud=null;function init(){if(!aud)aud=new (window.AudioContext||window.webkitAudioContext)();}function beep(f,d){init();let o=aud.createOscillator(),g=aud.createGain();o.frequency.value=f;o.connect(g);g.connect(aud.destination);g.gain.value=0.3;o.start();g.gain.exponentialRampToValueAtTime(0.01,aud.currentTime+d);o.stop(aud.currentTime+d);}function testSound(){beep(600,0.3);beep(800,0.3);}setInterval(()=>{c--;document.getElementById('t').innerText=c;if(c<=5){document.getElementById('t').style.color='red';beep(900,0.1);}if(c<=0)c=15;},1000);document.body.addEventListener('click',init,{once:true});</script></body></html>
