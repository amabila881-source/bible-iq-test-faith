<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible IQ Test</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;min-height:100vh}.card{background:#1e293b;width:100%;max-width:480px;margin:20px;border-radius:20px;padding:24px}h1{color:#fbbf24;text-align:center}.opt{width:100%;padding:14px;margin:8px 0;background:#334155;color:#fff;border:0;border-radius:10px;text-align:left;font-size:17px}.opt:active{background:#fbbf24;color:#000}</style></head><body><div class="card"><h1>📖 Bible IQ Test</h1><div id="sc" style="text-align:center;color:#fbbf24">Score: 0</div><div id="qq" style="font-size:20px;font-weight:700;margin:20px 0"></div><div id="oo"></div><div id="end" style="display:none;text-align:center"><h2 id="fin"></h2><button style="width:100%;padding:16px;background:#fbbf24;border:0;border-radius:10px;font-weight:700" onclick="location.reload()">Play Again</button></div></div><script>var Q=[["Who built the ark?","Noah","Moses","Abraham","David",0],["Creation in how many days?","6","7","40","3",0],["Who in lions den?","Daniel","Joseph","Paul","Peter",0],["David beat Goliath with?","Stone sling","Sword","Prayer","Bow",0],["Jesus born?","Bethlehem","Nazareth","Jerusalem","Egypt",0],["Disciples?","12","10","7","40",0],["Denied Jesus 3x?","Peter","Judas","John","Thomas",0],["First Bible book?","Genesis","Exodus","Matthew","Psalms",0],["Led Israel from Egypt?","Moses","Joshua","Abraham","Noah",0],["Fed 5000 with?","5 loaves 2 fish","Manna","Bread only","12 baskets",0]];var i=0,s=0;function load(){if(i>=Q.length){document.getElementById("qq").style.display="none";document.getElementById("oo").style.display="none";document.getElementById("end").style.display="block";document.getElementById("fin").innerText="Final Score "+s+" / "+Q.length;return;}var c=Q[i];document.getElementById("qq").innerText=(i+1)+". "+c[0];var oo=document.getElementById("oo");oo.innerHTML="";for(var k=1;k<=4;k++){var b=document.createElement("button");b.className="opt";b.innerText=c[k];(function(idx){b.onclick=function(){if(idx==c[5])s++;i++;document.getElementById("sc").innerText="Score: "+s;load();}})(k-1);oo.appendChild(b);}}load();</script></body></html>
