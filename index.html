<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Bible IQ Test</title><style>body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;display:flex;justify-content:center;min-height:100vh}.card{background:#1e293b;max-width:480px;width:100%;margin:20px;border-radius:24px;padding:24px}h1{text-align:center;color:#fbbf24}.btn{width:100%;padding:16px;margin:8px 0;border:0;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer}.btn-opt{background:#334155;color:#fff;text-align:left}</style></head><body><div class="card"><h1>📖 Bible IQ Test</h1><div id="score" style="text-align:center;color:#fbbf24">Score: 0</div><div id="game"><div id="q" style="font-size:20px;font-weight:600;margin:20px 0"></div><div id="opts"></div></div><div id="end" style="display:none;text-align:center"><h2 id="final"></h2><button style="width:100%;padding:16px;background:#f59e0b;border:0;border-radius:12px;font-weight:700" onclick="location.reload()">Play Again</button></div></div><script>const Q=[{q:"Who built the ark?",o:["Noah","Moses","Abraham","David"],a:0},{q:"Creation days?",o:["6","7","40","3"],a:0},{q:"Lions den?",o:["Daniel","Joseph","Paul","Peter"],a:0},{q:"David vs Goliath?",o:["Stone sling","Sword","Prayer","Bow"],a:0},{q:"Jesus born?",o:["Bethlehem","Nazareth","Jerusalem","Egypt"],a:0},{q:"Disciples?",o:["12","10","7","40"],a:0},{q:"Denied 3 times?",o:["Peter","Judas","John","Thomas"],a:0},{q:"First book?",o:["Genesis","Exodus","Matthew","Psalms"],a:0},{q:"Led out Egypt?",o:["Moses","Joshua","Abraham","Noah"],a:0},{q:"Fed 5000?",o:["5 loaves 2 fish","Manna","Bread only","12 baskets"],a:0}];let i=0,s=0;function load(){if(i>=Q.length){document.getElementById('game').style.display='none';document.getElementById('end').style.display='block';document.getElementById('final').innerText=Score s/{s}/s/{Q.length};return;}let c=Q[i];document.getElementById('q').innerText=(i+1)+". "+c.q;let o=document.getElementById('opts');o.innerHTML='';c.o.forEach((opt,k)=>{let b=document.createElement('button');b.className='btn btn-opt';b.innerText=opt;b.onclick=()=>{if(k==c.a)s++;i++;document.getElementById('score').innerText=Score: ${s};load();};o.appendChild(b);});}load();</script></body></html>
