let qs=[...ALL],i=0,s=0,lock=false;
function setLev(l){
document.querySelectorAll('.lev button').forEach(b=>b.classList.remove('active'));
document.getElementById('b-'+l).classList.add('active');
if(l==='all') qs=[...ALL]; else qs=ALL.filter(x=>x[7]===l);
i=0;s=0;load();
}
function load(){
if(i>=qs.length){
document.getElementById('qq').style.display='none';document.getElementById('oo').style.display='none';
document.getElementById('ex').style.display='none';document.getElementById('nx').style.display='none';
document.getElementById('end').style.display='block';
document.getElementById('fin').innerText=`Final ${s}/${qs.length}`;
document.getElementById('det').innerText=(s/qs.length>0.8?'Bible Genius!':s/qs.length>0.5?'Great Faith!':'Keep Studying!')+` You played ${qs.length} qs`;
document.getElementById('fl').style.width='100%';return;
}
lock=false;let c=qs[i];
document.getElementById('sc').innerText=`Score:${s}`;document.getElementById('ct').innerText=`${i+1}/${qs.length}`;
let db=document.getElementById('db');db.innerText=c[7];db.className='diff '+(c[7]==='Easy'?'easy':c[7]==='Medium'?'medium':'hard');
document.getElementById('fl').style.width=`${(i/qs.length)*100}%`;
document.getElementById('qq').innerText=(i+1)+". "+c[0];
let oo=document.getElementById('oo');oo.innerHTML='';
for(let k=1;k<=4;k++){let b=document.createElement('button');b.className='opt';b.innerText=c[k];b.onclick=()=>check(k-1,b);oo.appendChild(b);}
document.getElementById('ex').style.display='none';document.getElementById('nx').style.display='none';
}
function check(idx,btn){
if(lock) return;lock=true;let c=qs[i];let btns=document.querySelectorAll('.opt');
if(idx===c[5]){btn.classList.add('correct');s++;}else{btn.classList.add('wrong');btns[c[5]].classList.add('correct');}
document.getElementById('sc').innerText=`Score:${s}`;
let ex=document.getElementById('ex');
ex.innerHTML=`<b>${idx===c[5]?'✅ Correct!':'❌ Wrong! Answer: '+c[c[5]+1]}</b><br>${c[6]}`;
ex.style.display='block';document.getElementById('nx').style.display='block';
}
function nextQ(){i++;load();}
